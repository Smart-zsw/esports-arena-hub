name: 站点反馈
description: 数据不对、页面出错、或者想加个功能
title: "[反馈] "
labels: ["反馈"]
body:
  - type: markdown
    attributes:
      value: |
        业余时间维护，看到会尽量处理，但不承诺响应时间，也不一定都会做。
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 数据不对（比分 / 积分榜 / 阵容 / 分组）
        - 页面出错或显示异常
        - 想加个功能
        - 其它
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 具体情况
      description: 哪个赛事、哪一场、哪个页面；数据类问题请说明「页面显示什么」和「应该是什么」
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 设备与浏览器
      placeholder: 例如：iPhone Safari / Windows Chrome
    validations:
      required: false
